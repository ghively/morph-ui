name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: Regenerate visual baselines and upload them as an artifact
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: build · test · lint · typecheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm typecheck

  catalog:
    name: visual · a11y
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm catalog:build
      - name: Visual regression
        if: ${{ !inputs.update_snapshots }}
        run: pnpm exec playwright test e2e/visual.spec.ts
      - name: Regenerate visual baselines
        if: ${{ inputs.update_snapshots }}
        run: pnpm exec playwright test e2e/visual.spec.ts --update-snapshots
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.update_snapshots }}
        with:
          name: visual-baselines
          path: e2e/__screenshots__/
      - name: Accessibility
        if: ${{ !cancelled() }}
        run: pnpm exec playwright test e2e/a11y.spec.ts
      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
